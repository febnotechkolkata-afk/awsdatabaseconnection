spring.application.name=databasedemo
# Server address/port via DB_HOST environment variable (defaults to localhost:3306)
spring.datasource.url=jdbc:mysql://${DB_HOST}/databasedemo?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true